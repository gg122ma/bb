<!DOCTYPE html>
<!--
  ============================================================
  文件：test-embed.html
  职责：模拟"外部网站"嵌入 KMK 3D 地图
        用来测试 iframe + postMessage 双向通信是否正常工作

  使用方法：
    1. 先运行 npm run build 生成 dist/index.html
    2. 把 dist/index.html 改名为 kmk-campus.html 放到同级目录
    3. 用浏览器打开 test-embed.html
  ============================================================
-->
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试嵌入 — KMK Campus Map</title>
  <style>
    /* 页面基础样式 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      gap: 0;
    }

    /* 左侧：控制面板 */
    #control-panel {
      width: 280px;
      flex-shrink: 0;
      background: #1e293b;
      border-right: 1px solid #334155;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    #control-panel h2 {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* 按钮样式 */
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
    }
    .btn:hover { background: #1e3a5f; border-color: #3b82f6; }
    .btn-blue  { background: #1d4ed8; border-color: #3b82f6; }
    .btn-blue:hover { background: #2563eb; }
    .btn-red   { background: #7f1d1d; border-color: #ef4444; }
    .btn-red:hover { background: #991b1b; }

    /* 事件日志区 */
    #log {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      font-family: monospace;
      color: #94a3b8;
      height: 200px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #log .log-item { padding: 2px 0; border-bottom: 1px solid #1e293b; }
    #log .log-item.highlight { color: #4ade80; }

    /* 状态指示灯 */
    #status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444; /* 红色 = 未就绪 */
      transition: background 0.3s;
    }
    #status-dot.ready { background: #4ade80; } /* 绿色 = 就绪 */

    /* 右侧：iframe 区域 */
    #map-container {
      flex: 1;
      position: relative;
    }
    #kmk-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- ========== 左侧控制面板 ========== -->
  <div id="control-panel">

    <h2>🗺️ KMK 地图控制</h2>

    <!-- 状态指示灯 -->
    <div id="status">
      <div id="status-dot"></div>
      <span id="status-text">等待场景加载…</span>
    </div>

    <!-- 分组：镜头控制 -->
    <div>
      <h2 style="margin-bottom:8px">镜头控制</h2>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn btn-blue" onclick="sendCmd('RESET_CAMERA')">
          🌍 重置总览
        </button>
        <button class="btn" onclick="sendCmd('FLY_TO', 'perpustakaan')">
          📚 飞到图书馆
        </button>
        <button class="btn" onclick="sendCmd('FLY_TO', 'masjid')">
          🕌 飞到清真寺
        </button>
        <button class="btn" onclick="sendCmd('FLY_TO', 'cafe-admin')">
          🍛 飞到 Cafe Admin
        </button>
        <button class="btn" onclick="sendCmd('FLY_TO', 'kompleks-sukan')">
          🏸 飞到体育馆
        </button>
        <button class="btn" onclick="sendCmd('FLY_TO', 'asrama-a1')">
          🏠 飞到 Asrama A1
        </button>
        <button class="btn" onclick="sendCmd('FLY_TO', 'padang')">
          ⚽ 飞到足球场
        </button>
        <button class="btn" onclick="sendCmd('FLY_TO', 'guard-house')">
          🛡️ 飞到 Guard House
        </button>
      </div>
    </div>

    <!-- 分组：记忆墙控制 -->
    <div>
      <h2 style="margin-bottom:8px">记忆墙控制</h2>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn" onclick="sendCmd('OPEN_MEMORY_WALL', 'perpustakaan')">
          📖 直接打开图书馆记忆墙
        </button>
        <button class="btn btn-red" onclick="sendCmd('CLOSE_MEMORY_WALL')">
          ✕ 关闭记忆墙
        </button>
      </div>
    </div>

    <!-- 分组：事件日志 -->
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-height:0">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>事件日志</h2>
        <button class="btn" style="width:auto;padding:4px 8px;font-size:11px" onclick="clearLog()">
          清空
        </button>
      </div>
      <div id="log">
        <div class="log-item">等待来自 KMK 地图的事件…</div>
      </div>
    </div>

    <!-- 说明文字 -->
    <p style="font-size:11px;color:#475569;line-height:1.6">
      这是测试页面，模拟外部网站嵌入 KMK 3D 地图。
      左侧按钮向 iframe 发送指令，
      日志区显示从 iframe 收到的事件。
    </p>
  </div>

  <!-- ========== 右侧 iframe ========== -->
  <div id="map-container">
    <!--
      src 指向打包好的单文件 HTML
      生产部署时把 src 改为实际 URL，如：
      src="https://your-cdn.com/kmk-campus.html"
    -->
    <iframe
      id="kmk-iframe"
      src="./index.html"
      title="KMK Campus Heritage Map"
      allow="fullscreen"
    ></iframe>
  </div>

  <script>
    const iframe = document.getElementById('kmk-iframe');
    const log    = document.getElementById('log');
    const dot    = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    // ========== 向 iframe 发送指令 ==========
    function sendCmd(type, buildingId) {
      const msg = buildingId ? { type, buildingId } : { type };
      iframe.contentWindow.postMessage(msg, '*');
      addLog(`▶ 发送: ${JSON.stringify(msg)}`, false);
    }

    // ========== 监听来自 iframe 的事件 ==========
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data || !data.type) return;

      // 场景就绪：更新状态灯
      if (data.type === 'SCENE_READY') {
        dot.classList.add('ready');
        statusText.textContent = '✅ 场景已就绪';
      }

      addLog(`◀ 收到: ${JSON.stringify(data)}`, true);
    });

    // ========== 添加日志条目 ==========
    function addLog(msg, highlight) {
      const item = document.createElement('div');
      item.className = 'log-item' + (highlight ? ' highlight' : '');
      item.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      log.insertBefore(item, log.firstChild); // 最新在上
    }

    // ========== 清空日志 ==========
    function clearLog() {
      log.innerHTML = '';
    }
  </script>
</body>
</html>
